# Cloudflare Tunnel config for FlowGrid production.
# Location: /etc/cloudflared/config.yml
# Auto-generated by setup-vps.sh — edit with care.
# 
# Replace <TUNNEL_ID> with your actual Cloudflare Tunnel ID.
# Credentials file is auto-generated by cloudflared.

tunnel: <TUNNEL_ID>
credentials-file: /home/<DEPLOY_USER>/.cloudflared/<TUNNEL_ID>.json

ingress:
  # Frontend (Next.js)
  - hostname: flowgrid.live
    service: http://localhost:3000

  # Backend API (FastAPI)
  - hostname: api.flowgrid.live
    service: http://localhost:8000
    originRequest:
      connectTimeout: 30s
      noTLSVerify: false

  # Catch-all
  - service: http_status:404

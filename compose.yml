name: visgniteai

# ---------- shared config ----------
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-restart: &default-restart
  restart: unless-stopped

services:
  # ---------- data stores (internal only) ----------
  db:
    image: postgres:16-alpine
    <<: *default-restart
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mission_control}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Bind to localhost for dev; in prod behind reverse proxy, no port exposure needed.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    <<: *default-restart
    logging: *default-logging
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    <<: *default-restart
    logging: *default-logging
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M

  # ---------- openclaw gateway ----------
  openclaw:
    profiles:
      - managed-gateway
    image: openclaw/gateway:latest
    # Bind to 0.0.0.0 so other containers can reach the gateway via Docker network.
    # Config in openclaw/openclaw.json sets controlUi fallback for non-loopback bind.
    command: ["node", "openclaw.mjs", "gateway", "--allow-unconfigured", "--bind", "lan"]
    <<: *default-restart
    logging: *default-logging
    environment:
      OPENCLAW_HOME: /data
      OPENCLAW_CONFIG_PATH: /data/config/openclaw.json
      OPENCLAW_STATE_DIR: /data/.openclaw
      OPENCLAW_GATEWAY_TOKEN: ${MANAGED_GATEWAY_TOKEN:-}
    volumes:
      - openclaw_data:/data
      - device_identity:/shared/device-identity
      - openclaw_managed:/shared/openclaw-managed
      - ./openclaw:/data/config
    ports:
      - "127.0.0.1:18789:18789"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:18789/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G

  # ---------- application ----------
  backend:
    build:
      # Build from repo root so the backend image can include repo-level assets
      # like `backend/templates/`.
      context: .
      dockerfile: backend/Dockerfile
    <<: *default-restart
    logging: *default-logging
    env_file:
      - ./backend/.env
    environment:
      # Override localhost defaults for container networking
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-mission_control}
      # BASE_URL must be reachable from openclaw container (not localhost)
      BASE_URL: http://backend:8000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      DB_AUTO_MIGRATE: ${DB_AUTO_MIGRATE:-true}
      AUTH_MODE: ${AUTH_MODE}
      LOCAL_AUTH_TOKEN: ${LOCAL_AUTH_TOKEN}
      RQ_REDIS_URL: redis://redis:6379/0
      WORKER_HEARTBEAT_KEY: ${WORKER_HEARTBEAT_KEY:-visgniteai:worker:heartbeat}
      READINESS_WORKER_HEARTBEAT_KEY: ${READINESS_WORKER_HEARTBEAT_KEY:-visgniteai:worker:heartbeat}
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-board-chat-files}
      OBJECT_STORAGE_USE_SSL: "false"
      MANAGED_GATEWAY_URL: ws://openclaw:18789/ws
      MANAGED_GATEWAY_TOKEN: ${MANAGED_GATEWAY_TOKEN:-}
      INBOUND_WEBHOOK_MAX_BODY_BYTES: ${INBOUND_WEBHOOK_MAX_BODY_BYTES:-262144}
      INBOUND_WEBHOOK_PREVIEW_MAX_CHARS: ${INBOUND_WEBHOOK_PREVIEW_MAX_CHARS:-4000}
      MANAGED_GATEWAY_WORKSPACE_ROOT: /shared/openclaw-managed
      OPENCLAW_GATEWAY_DEVICE_IDENTITY_PATH: /shared/device-identity/device.json
    volumes:
      - device_identity:/shared/device-identity
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - internal
      - public
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1G

  frontend:
    profiles:
      - docker-frontend
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-auto}
        NEXT_PUBLIC_AUTH_MODE: ${NEXT_PUBLIC_AUTH_MODE:-${AUTH_MODE:-local}}
        NEXT_PUBLIC_AUTH_PROFILE: ${NEXT_PUBLIC_AUTH_PROFILE:-self_hosted}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: ${NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL:-/boards}
        NEXT_PUBLIC_CLERK_AFTER_SIGN_OUT_URL: ${NEXT_PUBLIC_CLERK_AFTER_SIGN_OUT_URL:-/}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
        NEXT_PUBLIC_BOARD_PLANNING_OVERLAY_V1: ${NEXT_PUBLIC_BOARD_PLANNING_OVERLAY_V1:-false}
        NEXT_PUBLIC_BOARD_QUERY_V2: ${NEXT_PUBLIC_BOARD_QUERY_V2:-false}
    <<: *default-restart
    logging: *default-logging
    # Optional, user-managed env file for runtime vars (CLERK_SECRET_KEY, etc.).
    env_file:
      - path: ./frontend/.env
        required: false
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-auto}
      NEXT_PUBLIC_AUTH_MODE: ${AUTH_MODE}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - public
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    develop:
      watch:
        # Rebuild frontend image when UI source or build config changes.
        - action: rebuild
          path: ./frontend/src
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/package-lock.json
        - action: rebuild
          path: ./frontend/next.config.ts
        - action: rebuild
          path: ./frontend/postcss.config.js
        - action: rebuild
          path: ./frontend/tailwind.config.cjs
        - action: rebuild
          path: ./frontend/tsconfig.json

  webhook-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "scripts/rq-docker", "worker"]
    <<: *default-restart
    logging: *default-logging
    env_file:
      - ./backend/.env
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-mission_control}
      BASE_URL: http://backend:8000
      AUTH_MODE: ${AUTH_MODE}
      LOCAL_AUTH_TOKEN: ${LOCAL_AUTH_TOKEN}
      RQ_REDIS_URL: redis://redis:6379/0
      RQ_QUEUE_NAME: ${RQ_QUEUE_NAME:-default}
      RQ_DISPATCH_THROTTLE_SECONDS: ${RQ_DISPATCH_THROTTLE_SECONDS:-2.0}
      RQ_DISPATCH_MAX_RETRIES: ${RQ_DISPATCH_MAX_RETRIES:-3}
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-board-chat-files}
      OBJECT_STORAGE_USE_SSL: "false"
      WORKER_HEARTBEAT_KEY: ${WORKER_HEARTBEAT_KEY:-visgniteai:worker:heartbeat}
      MANAGED_GATEWAY_URL: ws://openclaw:18789/ws
      MANAGED_GATEWAY_TOKEN: ${MANAGED_GATEWAY_TOKEN:-}
      OPENCLAW_GATEWAY_DEVICE_IDENTITY_PATH: /shared/device-identity/device.json
    volumes:
      - device_identity:/shared/device-identity
    networks:
      - internal
    # Worker healthcheck: verify the process is alive and can import app modules.
    healthcheck:
      test: ["CMD-SHELL", "python -c 'from app.services.queue_worker import run_worker' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

networks:
  # Internal: db, redis, minio, backend, worker — not reachable from host except via mapped ports.
  internal:
    driver: bridge
  # Public: backend + frontend — services that need external access.
  public:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  openclaw_data:
  openclaw_managed:
  device_identity:

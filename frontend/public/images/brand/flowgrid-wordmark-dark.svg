<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" width="360" height="80">
  <defs>
    <linearGradient id="wbgd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="wflowd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Mini logo icon -->
  <rect x="4" y="4" width="72" height="72" rx="18" ry="18" fill="url(#wbgd)"/>
  <rect x="4" y="4" width="72" height="72" rx="18" ry="18" fill="none" stroke="#475569" stroke-width="0.5"/>

  <!-- Simplified grid: 4 dots + flow + center -->
  <circle cx="26" cy="26" r="4.5" fill="#CBD5E1" opacity="0.75"/>
  <circle cx="54" cy="26" r="4.5" fill="#CBD5E1" opacity="0.75"/>
  <circle cx="26" cy="54" r="4.5" fill="#CBD5E1" opacity="0.75"/>
  <circle cx="54" cy="54" r="4.5" fill="#CBD5E1" opacity="0.75"/>
  <path d="M40 24 C40 30, 36 34, 35 40 C34 46, 40 50, 40 56"
        stroke="url(#wflowd)" stroke-width="2" fill="none" opacity="0.9" stroke-linecap="round"/>
  <circle cx="40" cy="40" r="5.5" fill="#FCD34D"/>
  <circle cx="40" cy="40" r="2.5" fill="#78350F"/>

  <!-- Wordmark text - dark mode -->
  <text x="92" y="45" font-family="'Space Grotesk', system-ui, sans-serif" font-size="32" font-weight="700" letter-spacing="-0.5" fill="#F1F5F9">FlowGrid</text>
  <text x="92" y="63" font-family="'DM Sans', system-ui, sans-serif" font-size="9.5" font-weight="400" letter-spacing="1.7" fill="rgba(255,255,255,0.45)">OPENCLAW · AGENT OPERATIONS</text>
</svg>

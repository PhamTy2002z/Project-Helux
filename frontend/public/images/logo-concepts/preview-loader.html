<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VisgniteAI — Brand Loader Preview</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; }

    .scene {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 50vh;
      gap: 16px;
    }
    .scene.light { background: #F8FAFC; }
    .scene.dark { background: #0F172A; }
    .scene p { font-size: 14px; }
    .scene.light p { color: #64748B; }
    .scene.dark p { color: #64748B; }

    .sizes {
      display: flex;
      align-items: flex-end;
      gap: 40px;
      justify-content: center;
      padding: 40px;
    }
    .sizes .item { text-align: center; }
    .sizes .label { font-size: 11px; color: #94A3B8; margin-top: 8px; }

    h2 {
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      color: #94A3B8;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 24px 0 0;
    }

    /* ==================== ANIMATION ==================== */
    .brand-loader { --dur: 2.4s; }

    .bl-node {
      opacity: 0;
      animation: blNodePulse var(--dur) ease-in-out infinite;
    }
    .bl-n1 { animation-delay: 0s; }
    .bl-n2 { animation-delay: 0.12s; }
    .bl-n3 { animation-delay: 0.24s; }
    .bl-n4 { animation-delay: 0.36s; }

    @keyframes blNodePulse {
      0%, 100% { opacity: 0.15; }
      25%, 75% { opacity: 0.8; }
    }

    .bl-flow {
      stroke-dasharray: 220;
      stroke-dashoffset: 220;
      animation: blFlowDraw var(--dur) ease-in-out infinite;
    }

    @keyframes blFlowDraw {
      0% { stroke-dashoffset: 220; opacity: 0; }
      15% { opacity: 1; }
      50% { stroke-dashoffset: 0; opacity: 1; }
      80% { stroke-dashoffset: 0; opacity: 0.6; }
      100% { stroke-dashoffset: -220; opacity: 0; }
    }

    .bl-glow {
      opacity: 0;
      transform-origin: 256px 256px;
      animation: blGlowPulse var(--dur) ease-in-out infinite;
    }

    @keyframes blGlowPulse {
      0%, 100% { opacity: 0; transform: scale(0.5); }
      40% { opacity: 0.8; transform: scale(1.2); }
      70% { opacity: 0.4; transform: scale(1); }
    }

    .bl-center {
      opacity: 0;
      transform-origin: 256px 256px;
      animation: blCenterPop var(--dur) ease-out infinite;
    }

    @keyframes blCenterPop {
      0%, 15% { opacity: 0; transform: scale(0); }
      35% { opacity: 1; transform: scale(1.1); }
      45%, 75% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(0.8); }
    }

    .bl-center-inner {
      opacity: 0;
      transform-origin: 256px 256px;
      animation: blCenterPop var(--dur) ease-out infinite;
      animation-delay: 0.08s;
    }
  </style>
</head>
<body>

  <!-- Light background -->
  <h2>Light Background</h2>
  <div class="scene light">
    <svg class="brand-loader" viewBox="0 0 512 512" width="72" height="72">
      <defs>
        <linearGradient id="bl-bg" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#1E293B"/>
          <stop offset="100%" stop-color="#020617"/>
        </linearGradient>
        <linearGradient id="bl-flow" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#FCD34D"/>
          <stop offset="100%" stop-color="#F59E0B"/>
        </linearGradient>
        <radialGradient id="bl-glow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#FCD34D" stop-opacity="0.5"/>
          <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bl-bg)"/>
      <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="#334155" stroke-width="1"/>
      <circle class="bl-node bl-n1" cx="176" cy="176" r="28" fill="#CBD5E1"/>
      <circle class="bl-node bl-n2" cx="336" cy="176" r="28" fill="#CBD5E1"/>
      <circle class="bl-node bl-n3" cx="176" cy="336" r="28" fill="#CBD5E1"/>
      <circle class="bl-node bl-n4" cx="336" cy="336" r="28" fill="#CBD5E1"/>
      <path class="bl-flow" d="M256 164 C256 200, 216 224, 212 256 C208 288, 256 310, 256 348"
            stroke="url(#bl-flow)" stroke-width="8" fill="none" stroke-linecap="round"/>
      <circle class="bl-glow" cx="256" cy="256" r="48" fill="url(#bl-glow)"/>
      <circle class="bl-center" cx="256" cy="256" r="32" fill="#FCD34D"/>
      <circle class="bl-center-inner" cx="256" cy="256" r="15" fill="#78350F"/>
    </svg>
    <p>Loading VisgniteAI...</p>
  </div>

  <!-- Dark background -->
  <h2>Dark Background</h2>
  <div class="scene dark">
    <svg class="brand-loader" viewBox="0 0 512 512" width="72" height="72">
      <use href="#bl-bg"/>
      <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bl-bg)"/>
      <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="#334155" stroke-width="1"/>
      <circle class="bl-node bl-n1" cx="176" cy="176" r="28" fill="#CBD5E1"/>
      <circle class="bl-node bl-n2" cx="336" cy="176" r="28" fill="#CBD5E1"/>
      <circle class="bl-node bl-n3" cx="176" cy="336" r="28" fill="#CBD5E1"/>
      <circle class="bl-node bl-n4" cx="336" cy="336" r="28" fill="#CBD5E1"/>
      <path class="bl-flow" d="M256 164 C256 200, 216 224, 212 256 C208 288, 256 310, 256 348"
            stroke="url(#bl-flow)" stroke-width="8" fill="none" stroke-linecap="round"/>
      <circle class="bl-glow" cx="256" cy="256" r="48" fill="url(#bl-glow)"/>
      <circle class="bl-center" cx="256" cy="256" r="32" fill="#FCD34D"/>
      <circle class="bl-center-inner" cx="256" cy="256" r="15" fill="#78350F"/>
    </svg>
    <p>Loading VisgniteAI...</p>
  </div>

  <!-- Size variations -->
  <h2>Size Variations</h2>
  <div class="sizes" style="background:#F8FAFC;">
    <div class="item">
      <svg class="brand-loader" viewBox="0 0 512 512" width="32" height="32">
        <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bl-bg)"/>
        <circle class="bl-node bl-n1" cx="176" cy="176" r="28" fill="#CBD5E1"/>
        <circle class="bl-node bl-n2" cx="336" cy="176" r="28" fill="#CBD5E1"/>
        <circle class="bl-node bl-n3" cx="176" cy="336" r="28" fill="#CBD5E1"/>
        <circle class="bl-node bl-n4" cx="336" cy="336" r="28" fill="#CBD5E1"/>
        <path class="bl-flow" d="M256 164 C256 200, 216 224, 212 256 C208 288, 256 310, 256 348"
              stroke="url(#bl-flow)" stroke-width="8" fill="none" stroke-linecap="round"/>
        <circle class="bl-glow" cx="256" cy="256" r="48" fill="url(#bl-glow)"/>
        <circle class="bl-center" cx="256" cy="256" r="32" fill="#FCD34D"/>
        <circle class="bl-center-inner" cx="256" cy="256" r="15" fill="#78350F"/>
      </svg>
      <div class="label">32px (inline)</div>
    </div>
    <div class="item">
      <svg class="brand-loader" viewBox="0 0 512 512" width="48" height="48">
        <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bl-bg)"/>
        <circle class="bl-node bl-n1" cx="176" cy="176" r="28" fill="#CBD5E1"/>
        <circle class="bl-node bl-n2" cx="336" cy="176" r="28" fill="#CBD5E1"/>
        <circle class="bl-node bl-n3" cx="176" cy="336" r="28" fill="#CBD5E1"/>
        <circle class="bl-node bl-n4" cx="336" cy="336" r="28" fill="#CBD5E1"/>
        <path class="bl-flow" d="M256 164 C256 200, 216 224, 212 256 C208 288, 256 310, 256 348"
              stroke="url(#bl-flow)" stroke-width="8" fill="none" stroke-linecap="round"/>
        <circle class="bl-glow" cx="256" cy="256" r="48" fill="url(#bl-glow)"/>
        <circle class="bl-center" cx="256" cy="256" r="32" fill="#FCD34D"/>
        <circle class="bl-center-inner" cx="256" cy="256" r="15" fill="#78350F"/>
      </svg>
      <div class="label">48px (button)</div>
    </div>
    <div class="item">
      <svg class="brand-loader" viewBox="0 0 512 512" width="72" height="72">
        <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bl-bg)"/>
        <circle class="bl-node bl-n1" cx="176" cy="176" r="28" fill="#CBD5E1"/>
        <circle class="bl-node bl-n2" cx="336" cy="176" r="28" fill="#CBD5E1"/>
        <circle class="bl-node bl-n3" cx="176" cy="336" r="28" fill="#CBD5E1"/>
        <circle class="bl-node bl-n4" cx="336" cy="336" r="28" fill="#CBD5E1"/>
        <path class="bl-flow" d="M256 164 C256 200, 216 224, 212 256 C208 288, 256 310, 256 348"
              stroke="url(#bl-flow)" stroke-width="8" fill="none" stroke-linecap="round"/>
        <circle class="bl-glow" cx="256" cy="256" r="48" fill="url(#bl-glow)"/>
        <circle class="bl-center" cx="256" cy="256" r="32" fill="#FCD34D"/>
        <circle class="bl-center-inner" cx="256" cy="256" r="15" fill="#78350F"/>
      </svg>
      <div class="label">72px (page loader)</div>
    </div>
    <div class="item">
      <svg class="brand-loader" viewBox="0 0 512 512" width="120" height="120">
        <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bl-bg)"/>
        <circle class="bl-node bl-n1" cx="176" cy="176" r="28" fill="#CBD5E1"/>
        <circle class="bl-node bl-n2" cx="336" cy="176" r="28" fill="#CBD5E1"/>
        <circle class="bl-node bl-n3" cx="176" cy="336" r="28" fill="#CBD5E1"/>
        <circle class="bl-node bl-n4" cx="336" cy="336" r="28" fill="#CBD5E1"/>
        <path class="bl-flow" d="M256 164 C256 200, 216 224, 212 256 C208 288, 256 310, 256 348"
              stroke="url(#bl-flow)" stroke-width="8" fill="none" stroke-linecap="round"/>
        <circle class="bl-glow" cx="256" cy="256" r="48" fill="url(#bl-glow)"/>
        <circle class="bl-center" cx="256" cy="256" r="32" fill="#FCD34D"/>
        <circle class="bl-center-inner" cx="256" cy="256" r="15" fill="#78350F"/>
      </svg>
      <div class="label">120px (splash)</div>
    </div>
  </div>

</body>
</html>

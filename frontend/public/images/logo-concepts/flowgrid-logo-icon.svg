<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark Slate base gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="40%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <!-- Amber flow accent -->
    <linearGradient id="flow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <!-- Warm center glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="42%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
    <!-- Amber node glow -->
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FCD34D" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background rounded square -->
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="url(#bg)"/>
  <!-- Subtle edge highlight -->
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="none" stroke="#334155" stroke-width="1"/>
  <!-- Center warmth -->
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="url(#glow)"/>

  <!-- Grid structure lines (very subtle) -->
  <line x1="128" y1="176" x2="384" y2="176" stroke="#475569" stroke-width="1" opacity="0.2"/>
  <line x1="128" y1="256" x2="384" y2="256" stroke="#475569" stroke-width="1" opacity="0.15"/>
  <line x1="128" y1="336" x2="384" y2="336" stroke="#475569" stroke-width="1" opacity="0.2"/>
  <line x1="176" y1="128" x2="176" y2="384" stroke="#475569" stroke-width="1" opacity="0.2"/>
  <line x1="256" y1="128" x2="256" y2="384" stroke="#475569" stroke-width="1" opacity="0.15"/>
  <line x1="336" y1="128" x2="336" y2="384" stroke="#475569" stroke-width="1" opacity="0.2"/>

  <!-- Connection segments (silver) -->
  <!-- Horizontal -->
  <line x1="196" y1="176" x2="236" y2="176" stroke="#94A3B8" stroke-width="2.5" opacity="0.28" stroke-linecap="round"/>
  <line x1="276" y1="176" x2="316" y2="176" stroke="#94A3B8" stroke-width="2.5" opacity="0.28" stroke-linecap="round"/>
  <line x1="196" y1="336" x2="236" y2="336" stroke="#94A3B8" stroke-width="2.5" opacity="0.28" stroke-linecap="round"/>
  <line x1="276" y1="336" x2="316" y2="336" stroke="#94A3B8" stroke-width="2.5" opacity="0.28" stroke-linecap="round"/>
  <!-- Vertical -->
  <line x1="176" y1="196" x2="176" y2="236" stroke="#94A3B8" stroke-width="2.5" opacity="0.28" stroke-linecap="round"/>
  <line x1="176" y1="276" x2="176" y2="316" stroke="#94A3B8" stroke-width="2.5" opacity="0.28" stroke-linecap="round"/>
  <line x1="336" y1="196" x2="336" y2="236" stroke="#94A3B8" stroke-width="2.5" opacity="0.28" stroke-linecap="round"/>
  <line x1="336" y1="276" x2="336" y2="316" stroke="#94A3B8" stroke-width="2.5" opacity="0.28" stroke-linecap="round"/>

  <!-- Hero flow: S-curve (amber) -->
  <path d="M256 196 C256 220, 224 232, 218 256 C212 280, 256 294, 256 316"
        stroke="url(#flow)" stroke-width="4.5" fill="none" opacity="0.9" stroke-linecap="round"/>
  <!-- Secondary flow: top-right curving toward center -->
  <path d="M336 196 C336 224, 306 242, 276 256"
        stroke="#F59E0B" stroke-width="2" fill="none" opacity="0.22" stroke-linecap="round"/>
  <!-- Tertiary flow: center curving to bottom-left -->
  <path d="M236 256 C216 270, 196 286, 176 316"
        stroke="#F59E0B" stroke-width="2" fill="none" opacity="0.15" stroke-linecap="round"/>

  <!-- Grid nodes (silver) -->
  <circle cx="176" cy="176" r="16" fill="#CBD5E1" opacity="0.8"/>
  <circle cx="256" cy="176" r="16" fill="#CBD5E1" opacity="0.85"/>
  <circle cx="336" cy="176" r="16" fill="#CBD5E1" opacity="0.8"/>
  <circle cx="176" cy="256" r="16" fill="#CBD5E1" opacity="0.8"/>
  <circle cx="336" cy="256" r="16" fill="#CBD5E1" opacity="0.8"/>
  <circle cx="176" cy="336" r="16" fill="#CBD5E1" opacity="0.8"/>
  <circle cx="256" cy="336" r="16" fill="#CBD5E1" opacity="0.85"/>
  <circle cx="336" cy="336" r="16" fill="#CBD5E1" opacity="0.8"/>

  <!-- Center node — amber hero -->
  <circle cx="256" cy="256" r="34" fill="url(#nodeGlow)"/>
  <circle cx="256" cy="256" r="22" fill="#FCD34D"/>
  <circle cx="256" cy="256" r="10" fill="#78350F"/>
</svg>

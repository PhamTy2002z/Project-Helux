name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "production"
        type: choice
        options:
          - production

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}
  BACKEND_IMAGE: ghcr.io/phamty2002z/flowgrid-backend
  FRONTEND_IMAGE: ghcr.io/phamty2002z/flowgrid-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tag
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "version=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_AUTH_MODE=${{ secrets.NEXT_PUBLIC_AUTH_MODE || 'local' }}
            NEXT_PUBLIC_AUTH_PROFILE=${{ secrets.NEXT_PUBLIC_AUTH_PROFILE || 'self_hosted' }}
            NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_BOARD_PLANNING_OVERLAY_V1=${{ secrets.NEXT_PUBLIC_BOARD_PLANNING_OVERLAY_V1 || 'false' }}
            NEXT_PUBLIC_BOARD_QUERY_V2=${{ secrets.NEXT_PUBLIC_BOARD_QUERY_V2 || 'false' }}
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL=${{ secrets.NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL || '/boards' }}
            NEXT_PUBLIC_CLERK_AFTER_SIGN_OUT_URL=${{ secrets.NEXT_PUBLIC_CLERK_AFTER_SIGN_OUT_URL || '/' }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    runs-on: self-hosted
    needs: build-and-push
    environment: production

    steps:
      - name: Pull and restart containers
        run: |
          set -euo pipefail
          cd /opt/projects/Project-FlowGrid

          # Login to GHCR
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

          # Update image tag
          export GHCR_IMAGE_TAG="${{ needs.build-and-push.outputs.image_tag }}"

          # Pull new images (webhook-worker shares backend image)
          docker compose -f compose.prod.yml --env-file .env.prod pull backend frontend webhook-worker

          # Rolling restart — db/redis/minio stay up
          docker compose -f compose.prod.yml --env-file .env.prod up -d --no-deps backend webhook-worker frontend

          # Wait for health
          sleep 10
          docker compose -f compose.prod.yml --env-file .env.prod ps

          # Cleanup old images
          docker image prune -f --filter "until=72h"

          echo "Deploy complete: tag=$GHCR_IMAGE_TAG"

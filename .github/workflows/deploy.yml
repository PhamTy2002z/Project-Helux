name: Deploy

on:
  # Gate: only deploy after CI passes on main
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "production"
        type: choice
        options:
          - production

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/flowgrid-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/flowgrid-frontend

jobs:
  build-and-push:
    # Only run if CI passed (workflow_run) or manual trigger (workflow_dispatch)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tag
        id: meta
        run: |
          COMMIT_SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          SHORT_SHA="${COMMIT_SHA::7}"
          echo "version=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_AUTH_MODE=${{ secrets.NEXT_PUBLIC_AUTH_MODE || 'local' }}
            NEXT_PUBLIC_AUTH_PROFILE=${{ secrets.NEXT_PUBLIC_AUTH_PROFILE || 'self_hosted' }}
            NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_BOARD_PLANNING_OVERLAY_V1=${{ secrets.NEXT_PUBLIC_BOARD_PLANNING_OVERLAY_V1 || 'false' }}
            NEXT_PUBLIC_BOARD_QUERY_V2=${{ secrets.NEXT_PUBLIC_BOARD_QUERY_V2 || 'false' }}
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL=${{ secrets.NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL || '/boards' }}
            NEXT_PUBLIC_CLERK_AFTER_SIGN_OUT_URL=${{ secrets.NEXT_PUBLIC_CLERK_AFTER_SIGN_OUT_URL || '/' }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    runs-on: self-hosted
    needs: build-and-push
    environment: production
    timeout-minutes: 10

    steps:
      - name: Log in to GHCR
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and restart containers
        working-directory: /opt/projects/Project-FlowGrid
        env:
          GHCR_IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          set -euo pipefail

          # Pull new images (webhook-worker shares backend image)
          docker compose -f compose.prod.yml --env-file .env.prod pull backend frontend webhook-worker

          # Rolling restart — db/redis/minio stay up
          docker compose -f compose.prod.yml --env-file .env.prod up -d --no-deps backend webhook-worker frontend

          echo "Deploy initiated: tag=$GHCR_IMAGE_TAG"

      - name: Verify deployment health
        run: |
          echo "Waiting for backend health check..."
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/healthz > /dev/null 2>&1; then
              echo "Backend is healthy"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Backend health check failed after 150s"
          exit 1

      - name: Show running containers
        if: always()
        working-directory: /opt/projects/Project-FlowGrid
        run: docker compose -f compose.prod.yml --env-file .env.prod ps

      - name: Cleanup old images
        if: always()
        run: docker image prune -f --filter "until=72h"

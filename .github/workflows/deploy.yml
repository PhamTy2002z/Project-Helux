name: Deploy

on:
  # Gate: only deploy after CI passes on main
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "production"
        type: choice
        options:
          - production

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-backend:
    # Only run if CI passed (workflow_run) or manual trigger (workflow_dispatch)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: self-hosted
    timeout-minutes: 15
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Compute image metadata
        id: meta
        run: |
          OWNER_LC="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          COMMIT_SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          SHORT_SHA="${COMMIT_SHA::7}"
          echo "version=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${OWNER_LC}/visgniteai-backend" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: |
            type=registry,ref=${{ steps.meta.outputs.image }}:buildcache
            type=gha,scope=backend
          cache-to: type=registry,ref=${{ steps.meta.outputs.image }}:buildcache,mode=max

  build-frontend:
    # Only run if CI passed (workflow_run) or manual trigger (workflow_dispatch)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: self-hosted
    timeout-minutes: 15
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Compute image metadata
        id: meta
        run: |
          OWNER_LC="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          COMMIT_SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          SHORT_SHA="${COMMIT_SHA::7}"
          echo "version=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${OWNER_LC}/visgniteai-frontend" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_AUTH_MODE=${{ secrets.NEXT_PUBLIC_AUTH_MODE || 'local' }}
            NEXT_PUBLIC_AUTH_PROFILE=${{ secrets.NEXT_PUBLIC_AUTH_PROFILE || 'self_hosted' }}
            NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_BOARD_PLANNING_OVERLAY_V1=${{ secrets.NEXT_PUBLIC_BOARD_PLANNING_OVERLAY_V1 || 'false' }}
            NEXT_PUBLIC_BOARD_QUERY_V2=${{ secrets.NEXT_PUBLIC_BOARD_QUERY_V2 || 'false' }}
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL=${{ secrets.NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL || '/boards' }}
            NEXT_PUBLIC_CLERK_AFTER_SIGN_OUT_URL=${{ secrets.NEXT_PUBLIC_CLERK_AFTER_SIGN_OUT_URL || '/' }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: |
            type=registry,ref=${{ steps.meta.outputs.image }}:buildcache
            type=gha,scope=frontend
          cache-to: type=registry,ref=${{ steps.meta.outputs.image }}:buildcache,mode=max

  deploy:
    runs-on: self-hosted
    needs: [build-backend, build-frontend]
    environment: production
    timeout-minutes: 10

    steps:
      - name: Log in to GHCR
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync project files
        working-directory: /opt/projects/VisgniteAI
        run: |
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git fetch origin main
          git reset --hard origin/main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and restart containers
        working-directory: /opt/projects/VisgniteAI
        env:
          GHCR_IMAGE_TAG: ${{ needs.build-backend.outputs.image_tag }}
        run: |
          set -euo pipefail

          # Pull new images (webhook-worker shares backend image)
          docker compose -f compose.prod.yml --env-file .env.prod pull backend frontend webhook-worker

          # Stop existing app containers (db/redis/minio stay up)
          docker compose -f compose.prod.yml --env-file .env.prod stop backend webhook-worker frontend 2>/dev/null || true
          docker compose -f compose.prod.yml --env-file .env.prod rm -f backend webhook-worker frontend 2>/dev/null || true

          # Kill any container holding our ports (e.g. from old compose project)
          for port in 8000 3000; do
            cid=$(docker ps -q --filter "publish=$port") || true
            [ -n "$cid" ] && docker rm -f "$cid" || true
          done

          # Ensure infra services are running and healthy
          docker compose -f compose.prod.yml --env-file .env.prod up -d db redis minio
          echo "Waiting for infra services to be healthy..."
          for i in $(seq 1 30); do
            healthy=$(docker compose -f compose.prod.yml --env-file .env.prod ps --format json db redis minio 2>/dev/null \
              | grep -c '"healthy"' || true)
            [ "$healthy" -ge 3 ] && echo "All infra services healthy" && break
            echo "  Attempt $i/30 — $healthy/3 healthy"
            sleep 5
          done

          # Start app services with new images
          docker compose -f compose.prod.yml --env-file .env.prod up -d --no-deps backend webhook-worker frontend

          echo "Deploy initiated: tag=$GHCR_IMAGE_TAG"

      - name: Verify deployment health
        run: |
          echo "Waiting for backend health check..."
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/healthz > /dev/null 2>&1; then
              echo "Backend is healthy"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Backend health check failed after 150s"
          exit 1

      - name: Show container logs on failure
        if: failure()
        working-directory: /opt/projects/VisgniteAI
        run: |
          echo "=== Backend logs ==="
          docker compose -f compose.prod.yml --env-file .env.prod logs --tail=50 backend 2>&1 || true
          echo "=== Frontend logs ==="
          docker compose -f compose.prod.yml --env-file .env.prod logs --tail=20 frontend 2>&1 || true

      - name: Show running containers
        if: always()
        working-directory: /opt/projects/VisgniteAI
        run: docker compose -f compose.prod.yml --env-file .env.prod ps

      - name: Cleanup old images
        if: always()
        run: docker image prune -f --filter "until=72h"

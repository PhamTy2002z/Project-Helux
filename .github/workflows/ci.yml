name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Block direct pushes to main — only allow merges via PR (GitHub web-flow bot)
  enforce-pr:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Reject direct push to main
        run: |
          if [ "${{ github.event.head_commit.committer.username }}" != "web-flow" ]; then
            echo "::error::Direct push to main detected. Use a pull request instead."
            exit 1
          fi

  check-backend:
    runs-on: self-hosted
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mission_control
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure PATH includes uv
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install backend dependencies
        run: make backend-sync

      - name: Validate ops scripts
        run: ./scripts/ci/validate_ops_scripts.sh

      - name: Run SaaS hardening gates
        env:
          AUTH_MODE: "local"
          LOCAL_AUTH_TOKEN: "ci-local-auth-token-0123456789-0123456789-0123456789x"
          BASE_URL: "http://localhost:8000"
        run: make backend-saas-gates

      - name: Run backend lint + typecheck
        env:
          AUTH_MODE: "local"
          LOCAL_AUTH_TOKEN: "ci-local-auth-token-0123456789-0123456789-0123456789x"
          CORS_ORIGINS: "http://localhost:3000"
        run: make backend-lint

      - name: Run backend tests with coverage
        env:
          AUTH_MODE: "local"
          LOCAL_AUTH_TOKEN: "ci-local-auth-token-0123456789-0123456789-0123456789x"
          CORS_ORIGINS: "http://localhost:3000"
        run: make backend-coverage

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          if-no-files-found: ignore
          path: backend/coverage.xml

  check-frontend:
    runs-on: self-hosted
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install frontend dependencies
        run: make frontend-sync

      - name: Run frontend checks
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_API_URL: "http://localhost:8000"
          NEXT_PUBLIC_AUTH_MODE: "local"
        run: |
          make frontend-format-check
          make frontend-lint
          make frontend-typecheck
          make frontend-test
          make frontend-build

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          if-no-files-found: ignore
          path: frontend/coverage/**

  check-migration:
    if: github.event_name == 'pull_request'
    runs-on: self-hosted
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure PATH includes uv
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install backend dependencies
        run: make backend-sync

      - name: Enforce one migration per PR
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: ./scripts/ci/one_migration_per_pr.sh

      - name: Run migration integrity gate
        env:
          BASE_URL: "http://localhost:8000"
          AUTH_MODE: "local"
          LOCAL_AUTH_TOKEN: "ci-local-auth-token-0123456789-0123456789-0123456789x"
        run: |
          set -euo pipefail

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.sha }}"
          git fetch --no-tags --depth=1 origin "$BASE_SHA"

          CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "Changed files:"
          echo "$CHANGED_FILES"

          if ! echo "$CHANGED_FILES" | grep -Eq '^backend/(app/models|db|migrations|alembic\.ini)'; then
            echo "No migration-relevant backend changes detected; skipping migration gate."
            exit 0
          fi

          if echo "$CHANGED_FILES" | grep -Eq '^backend/app/models/' && ! echo "$CHANGED_FILES" | grep -Eq '^backend/migrations/versions/'; then
            echo "Model changes detected without a migration under backend/migrations/versions/."
            exit 1
          fi

          make backend-migration-check

  check-docs:
    runs-on: self-hosted
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docs quality gates
        run: make docs-check

  security:
    runs-on: self-hosted
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy vulnerability scan
        run: trivy fs --severity CRITICAL,HIGH --exit-code 0 .

      - name: npm audit
        continue-on-error: true
        run: cd frontend && npm audit --audit-level=high

  installer:
    name: Installer (smoke test)
    runs-on: self-hosted
    needs: [check-backend, check-frontend]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate installer shell syntax
        run: bash -n install.sh

      - name: Installer smoke test (docker mode)
        run: |
          ./install.sh \
            --mode docker \
            --backend-port 18000 \
            --frontend-port 13000 \
            --public-host localhost \
            --api-url http://localhost:18000 \
            --token-mode generate

          backend_ready=0
          for _ in {1..120}; do
            if curl -fsS http://127.0.0.1:18000/healthz >/dev/null; then
              backend_ready=1
              break
            fi
            sleep 2
          done

          frontend_ready=0
          for _ in {1..120}; do
            if curl -fsS http://127.0.0.1:13000 >/dev/null; then
              frontend_ready=1
              break
            fi
            sleep 2
          done

          if [ "$backend_ready" -ne 1 ] || [ "$frontend_ready" -ne 1 ]; then
            echo "Installer docker smoke readiness failed: backend_ready=$backend_ready frontend_ready=$frontend_ready"
            docker compose -f compose.yml --env-file .env ps || true
            docker compose -f compose.yml --env-file .env logs --no-color --tail=200 backend db redis frontend webhook-worker || true
            exit 1
          fi

      - name: Cleanup docker stack after docker mode
        if: always()
        run: |
          docker compose -f compose.yml --env-file .env down -v --remove-orphans || true

      - name: Installer smoke test (local mode)
        env:
          XDG_STATE_HOME: ${{ github.workspace }}/.installer-state
        run: |
          ./install.sh \
            --mode local \
            --backend-port 18001 \
            --frontend-port 13001 \
            --public-host localhost \
            --api-url http://localhost:18001 \
            --token-mode generate \
            --db-mode docker \
            --start-services yes

          backend_ready=0
          for _ in {1..120}; do
            if curl -fsS http://127.0.0.1:18001/healthz >/dev/null; then
              backend_ready=1
              break
            fi
            sleep 2
          done

          frontend_ready=0
          for _ in {1..120}; do
            if curl -fsS http://127.0.0.1:13001 >/dev/null; then
              frontend_ready=1
              break
            fi
            sleep 2
          done

          if [ "$backend_ready" -ne 1 ] || [ "$frontend_ready" -ne 1 ]; then
            echo "Installer local smoke readiness failed: backend_ready=$backend_ready frontend_ready=$frontend_ready"
            LOG_DIR="$XDG_STATE_HOME/project-helux-install"
            if [ -f "$LOG_DIR/backend.log" ]; then
              echo "----- backend log (tail) -----"
              tail -n 200 "$LOG_DIR/backend.log" || true
            fi
            if [ -f "$LOG_DIR/frontend.log" ]; then
              echo "----- frontend log (tail) -----"
              tail -n 200 "$LOG_DIR/frontend.log" || true
            fi
            exit 1
          fi

      - name: Cleanup local processes and docker resources
        if: always()
        env:
          XDG_STATE_HOME: ${{ github.workspace }}/.installer-state
        run: |
          LOG_DIR="$XDG_STATE_HOME/project-helux-install"
          if [ -f "$LOG_DIR/backend.pid" ]; then kill "$(cat "$LOG_DIR/backend.pid")" || true; fi
          if [ -f "$LOG_DIR/frontend.pid" ]; then kill "$(cat "$LOG_DIR/frontend.pid")" || true; fi
          docker compose -f compose.yml --env-file .env down -v --remove-orphans || true

  e2e:
    runs-on: self-hosted
    needs: [check-frontend]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install frontend dependencies
        run: make frontend-sync

      - name: Start frontend (dev server)
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000"
          NEXT_PUBLIC_AUTH_MODE: "local"
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          cd frontend
          npm run dev -- --hostname 127.0.0.1 --port 3100 &
          for i in {1..60}; do
            if curl -sf http://127.0.0.1:3100/ > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "Frontend did not start"
          exit 1

      - name: Run Cypress E2E
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000"
          NEXT_PUBLIC_AUTH_MODE: "local"
          NEXT_TELEMETRY_DISABLED: "1"
          CYPRESS_baseUrl: "http://127.0.0.1:3100"
        run: |
          cd frontend
          npm run e2e -- --browser chrome

      - name: Cleanup dev server
        if: always()
        run: |
          pkill -f "next dev.*3100" || true

      - name: Upload Cypress artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          if-no-files-found: ignore
          path: |
            frontend/cypress/screenshots/**
            frontend/cypress/videos/**
